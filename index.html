<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        .glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
        }
        .hidden { display: none !important; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <!-- Auth Container -->
    <div id="auth-container" class="w-full max-w-md">
        
        <!-- Login Form -->
        <div id="login-card" class="glass rounded-2xl p-8 transition-all duration-300">
            <h2 class="text-3xl font-bold text-center mb-8 text-white tracking-tight">Login</h2>
            <form id="login-form" class="space-y-6">
                <div>
                    <label class="block text-sm font-medium mb-2 text-slate-300">E-mail</label>
                    <input type="email" id="login-email" class="w-full bg-slate-900/50 border border-slate-700/50 rounded-xl px-4 py-3 text-white focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all placeholder-slate-500" placeholder="seu@email.com">
                    <p id="login-email-error" class="text-red-400 text-sm mt-2 hidden"></p>
                </div>
                <div>
                    <label class="block text-sm font-medium mb-2 text-slate-300">Senha</label>
                    <input type="password" id="login-password" class="w-full bg-slate-900/50 border border-slate-700/50 rounded-xl px-4 py-3 text-white focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all placeholder-slate-500" placeholder="••••••••">
                    <p id="login-password-error" class="text-red-400 text-sm mt-2 hidden"></p>
                </div>
                <div id="login-general-error" class="text-red-400 text-sm text-center font-medium hidden"></div>
                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold rounded-xl px-4 py-3.5 transition-all duration-200 transform hover:-translate-y-0.5 shadow-lg shadow-indigo-500/25">Entrar</button>
            </form>
            <p class="mt-8 text-center text-slate-400 text-sm">
                Não tem uma conta? <button id="show-register" class="text-indigo-400 hover:text-indigo-300 font-medium transition-colors">Cadastre-se</button>
            </p>
        </div>

        <!-- Register Form -->
        <div id="register-card" class="glass rounded-2xl p-8 hidden transition-all duration-300">
            <h2 class="text-3xl font-bold text-center mb-8 text-white tracking-tight">Cadastro</h2>
            <form id="register-form" class="space-y-6">
                <div>
                    <label class="block text-sm font-medium mb-2 text-slate-300">Nome</label>
                    <input type="text" id="register-name" class="w-full bg-slate-900/50 border border-slate-700/50 rounded-xl px-4 py-3 text-white focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all placeholder-slate-500" placeholder="Seu nome">
                    <p id="register-name-error" class="text-red-400 text-sm mt-2 hidden"></p>
                </div>
                <div>
                    <label class="block text-sm font-medium mb-2 text-slate-300">E-mail</label>
                    <input type="email" id="register-email" class="w-full bg-slate-900/50 border border-slate-700/50 rounded-xl px-4 py-3 text-white focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all placeholder-slate-500" placeholder="seu@email.com">
                    <p id="register-email-error" class="text-red-400 text-sm mt-2 hidden"></p>
                </div>
                <div>
                    <label class="block text-sm font-medium mb-2 text-slate-300">Senha</label>
                    <input type="password" id="register-password" class="w-full bg-slate-900/50 border border-slate-700/50 rounded-xl px-4 py-3 text-white focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all placeholder-slate-500" placeholder="••••••••">
                    <p id="register-password-error" class="text-red-400 text-sm mt-2 hidden"></p>
                </div>
                <div id="register-general-error" class="text-red-400 text-sm text-center font-medium hidden"></div>
                <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold rounded-xl px-4 py-3.5 transition-all duration-200 transform hover:-translate-y-0.5 shadow-lg shadow-emerald-500/25">Criar Conta</button>
            </form>
            <p class="mt-8 text-center text-slate-400 text-sm">
                Já tem uma conta? <button id="show-login" class="text-indigo-400 hover:text-indigo-300 font-medium transition-colors">Faça login</button>
            </p>
        </div>
    </div>

    <!-- Main App Container -->
    <div id="app-container" class="w-full max-w-4xl hidden animate-fade-in">
        <header class="flex justify-between items-center mb-8 glass rounded-2xl p-6 shadow-xl">
            <div>
                <h1 class="text-2xl font-bold tracking-tight text-white">Minhas Tarefas</h1>
                <p id="user-greeting" class="text-slate-400 mt-1 text-sm">Bem-vindo</p>
            </div>
            <button id="logout-btn" class="bg-slate-800/50 hover:bg-red-500/10 text-slate-300 hover:text-red-400 px-5 py-2.5 rounded-xl font-medium transition-all duration-200 border border-slate-700/50 hover:border-red-500/30">
                Sair
            </button>
        </header>

        <main class="glass rounded-2xl p-12 text-center shadow-xl">
            <p class="text-slate-400 text-lg">Área de tarefas (Em construção...)</p>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
