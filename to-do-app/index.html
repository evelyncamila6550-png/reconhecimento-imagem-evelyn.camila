<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>To-Do App</title>
  <meta name="description" content="Gerencie suas tarefas com estilo. Login, cadastro e painel pessoal." />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    * { font-family: 'Inter', sans-serif; }

    body {
      background-color: #0f172a;
      background-image:
        radial-gradient(ellipse 80% 60% at 20% 0%, rgba(99,102,241,0.15) 0%, transparent 60%),
        radial-gradient(ellipse 60% 50% at 80% 100%, rgba(16,185,129,0.08) 0%, transparent 60%);
      min-height: 100vh;
      color: #f8fafc;
    }

    .glass {
      background: rgba(255,255,255,0.04);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.07);
      box-shadow: 0 8px 40px rgba(0,0,0,0.25), inset 0 1px 0 rgba(255,255,255,0.07);
    }

    .glass-input {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255,255,255,0.08);
      color: #f8fafc;
      transition: all 0.2s ease;
    }
    .glass-input:focus {
      outline: none;
      border-color: rgba(99,102,241,0.6);
      box-shadow: 0 0 0 3px rgba(99,102,241,0.15);
      background: rgba(15, 23, 42, 0.8);
    }
    .glass-input::placeholder { color: #475569; }

    .btn-primary {
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      box-shadow: 0 4px 20px rgba(99,102,241,0.35);
      transition: all 0.2s ease;
    }
    .btn-primary:hover {
      background: linear-gradient(135deg, #818cf8, #6366f1);
      box-shadow: 0 6px 28px rgba(99,102,241,0.5);
      transform: translateY(-1px);
    }
    .btn-primary:active { transform: translateY(0); }

    .btn-success {
      background: linear-gradient(135deg, #10b981, #059669);
      box-shadow: 0 4px 20px rgba(16,185,129,0.3);
      transition: all 0.2s ease;
    }
    .btn-success:hover {
      background: linear-gradient(135deg, #34d399, #10b981);
      box-shadow: 0 6px 28px rgba(16,185,129,0.4);
      transform: translateY(-1px);
    }

    .btn-danger {
      background: rgba(239,68,68,0.08);
      border: 1px solid rgba(239,68,68,0.2);
      color: #fca5a5;
      transition: all 0.2s ease;
    }
    .btn-danger:hover {
      background: rgba(239,68,68,0.18);
      border-color: rgba(239,68,68,0.4);
      color: #f87171;
      transform: translateY(-1px);
    }

    .hidden { display: none !important; }

    /* Fade in animation */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .fade-in { animation: fadeIn 0.35s ease forwards; }

    /* Slide between auth screens */
    @keyframes slideIn {
      from { opacity: 0; transform: translateX(24px); }
      to   { opacity: 1; transform: translateX(0); }
    }
    .slide-in { animation: slideIn 0.3s ease forwards; }

    /* Task card hover */
    .task-card {
      transition: all 0.2s ease;
    }
    .task-card:hover {
      border-color: rgba(255,255,255,0.12);
      transform: translateY(-2px);
      box-shadow: 0 12px 40px rgba(0,0,0,0.3);
    }
    .task-card.done {
      opacity: 0.45;
    }
    .task-card.done .task-title {
      text-decoration: line-through;
      color: #64748b;
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }

    /* Badge colors */
    .badge-trabalho  { background: rgba(59,130,246,0.18); color: #93c5fd; border: 1px solid rgba(59,130,246,0.3); }
    .badge-pessoal   { background: rgba(139,92,246,0.18); color: #c4b5fd; border: 1px solid rgba(139,92,246,0.3); }
    .badge-estudos   { background: rgba(16,185,129,0.18); color: #6ee7b7; border: 1px solid rgba(16,185,129,0.3); }

    /* Select options (dark) */
    select option { background: #1e293b; color: #f8fafc; }
  </style>
</head>
<body>

  <!-- ═══════════════════ AUTH WRAPPER ═══════════════════ -->
  <div id="auth-container" class="min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md">

      <!-- Login Card -->
      <div id="login-card" class="glass rounded-3xl p-8 fade-in">
        <div class="text-center mb-8">
          <div class="w-14 h-14 bg-indigo-500/20 rounded-2xl flex items-center justify-center mx-auto mb-4 border border-indigo-500/30">
            <svg class="w-7 h-7 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
          </div>
          <h1 class="text-2xl font-bold text-white">Bem-vindo de volta</h1>
          <p class="text-slate-400 text-sm mt-1">Faça login para acessar suas tarefas</p>
        </div>

        <form id="login-form" class="space-y-5">
          <div>
            <label class="block text-sm font-medium mb-2 text-slate-300">E-mail</label>
            <input id="login-email" type="email" class="glass-input w-full rounded-xl px-4 py-3 text-sm" placeholder="seu@email.com" />
            <p id="login-email-error" class="text-red-400 text-xs mt-1.5 hidden"></p>
          </div>
          <div>
            <label class="block text-sm font-medium mb-2 text-slate-300">Senha</label>
            <input id="login-password" type="password" class="glass-input w-full rounded-xl px-4 py-3 text-sm" placeholder="••••••••" />
            <p id="login-password-error" class="text-red-400 text-xs mt-1.5 hidden"></p>
          </div>
          <p id="login-general-error" class="text-red-400 text-sm text-center font-medium hidden"></p>
          <button id="login-submit-btn" type="submit" class="btn-primary w-full rounded-xl px-4 py-3.5 text-white font-semibold text-sm mt-2">
            Entrar
          </button>
        </form>

        <p class="mt-6 text-center text-slate-400 text-sm">
          Não tem conta?
          <button id="go-to-register" class="text-indigo-400 hover:text-indigo-300 font-medium ml-1 transition-colors">Cadastre-se</button>
        </p>
      </div>

      <!-- Register Card -->
      <div id="register-card" class="glass rounded-3xl p-8 hidden">
        <div class="text-center mb-8">
          <div class="w-14 h-14 bg-emerald-500/20 rounded-2xl flex items-center justify-center mx-auto mb-4 border border-emerald-500/30">
            <svg class="w-7 h-7 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
          </div>
          <h1 class="text-2xl font-bold text-white">Criar sua conta</h1>
          <p class="text-slate-400 text-sm mt-1">Comece a organizar suas tarefas hoje</p>
        </div>

        <form id="register-form" class="space-y-5">
          <div>
            <label class="block text-sm font-medium mb-2 text-slate-300">Nome completo</label>
            <input id="register-name" type="text" class="glass-input w-full rounded-xl px-4 py-3 text-sm" placeholder="Seu nome" />
            <p id="register-name-error" class="text-red-400 text-xs mt-1.5 hidden"></p>
          </div>
          <div>
            <label class="block text-sm font-medium mb-2 text-slate-300">E-mail</label>
            <input id="register-email" type="email" class="glass-input w-full rounded-xl px-4 py-3 text-sm" placeholder="seu@email.com" />
            <p id="register-email-error" class="text-red-400 text-xs mt-1.5 hidden"></p>
          </div>
          <div>
            <label class="block text-sm font-medium mb-2 text-slate-300">Senha</label>
            <input id="register-password" type="password" class="glass-input w-full rounded-xl px-4 py-3 text-sm" placeholder="••••••••" />
            <p id="register-password-error" class="text-red-400 text-xs mt-1.5 hidden"></p>
          </div>
          <p id="register-general-error" class="text-red-400 text-sm text-center font-medium hidden"></p>
          <button id="register-submit-btn" type="submit" class="btn-success w-full rounded-xl px-4 py-3.5 text-white font-semibold text-sm mt-2">
            Criar Conta
          </button>
        </form>

        <p class="mt-6 text-center text-slate-400 text-sm">
          Já tem conta?
          <button id="go-to-login" class="text-indigo-400 hover:text-indigo-300 font-medium ml-1 transition-colors">Fazer login</button>
        </p>
      </div>

    </div>
  </div>

  <!-- ═══════════════════ DASHBOARD ═══════════════════ -->
  <div id="dashboard-container" class="hidden min-h-screen flex flex-col">

    <!-- Header -->
    <header class="glass border-b border-white/5 px-6 py-4 sticky top-0 z-10">
      <div class="max-w-4xl mx-auto flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="w-9 h-9 bg-indigo-500/20 rounded-xl flex items-center justify-center border border-indigo-500/25">
            <svg class="w-4.5 h-4.5 text-indigo-400 w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
          </div>
          <div>
            <h1 class="text-base font-semibold text-white leading-tight">To-Do App</h1>
            <p id="header-greeting" class="text-xs text-slate-400"></p>
          </div>
        </div>
        <button id="logout-btn" class="btn-danger rounded-xl px-4 py-2 text-sm font-medium flex items-center gap-2">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
          Sair
        </button>
      </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 max-w-4xl mx-auto w-full px-4 py-8 space-y-8">

      <!-- Add Task Form -->
      <section class="glass rounded-3xl p-6 fade-in">
        <h2 class="text-lg font-semibold text-white mb-5 flex items-center gap-2">
          <svg class="w-5 h-5 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
          Nova Tarefa
        </h2>

        <form id="add-task-form" class="space-y-4">
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
              <label class="block text-sm font-medium mb-2 text-slate-300">Título <span class="text-red-400">*</span></label>
              <input id="task-title" type="text" class="glass-input w-full rounded-xl px-4 py-3 text-sm" placeholder="O que precisa ser feito?" />
              <p id="task-title-error" class="text-red-400 text-xs mt-1.5 hidden"></p>
            </div>
            <div>
              <label class="block text-sm font-medium mb-2 text-slate-300">Tipo</label>
              <select id="task-type" class="glass-input w-full rounded-xl px-4 py-3 text-sm cursor-pointer">
                <option value="Trabalho">💼 Trabalho</option>
                <option value="Pessoal">🏠 Pessoal</option>
                <option value="Estudos">📚 Estudos</option>
              </select>
            </div>
          </div>
          <div>
            <label class="block text-sm font-medium mb-2 text-slate-300">Descrição <span class="text-slate-500 font-normal">(opcional)</span></label>
            <textarea id="task-description" rows="3" class="glass-input w-full rounded-xl px-4 py-3 text-sm resize-none" placeholder="Detalhes adicionais..."></textarea>
          </div>
          <div class="flex justify-end">
            <button id="add-task-btn" type="submit" class="btn-primary rounded-xl px-6 py-3 text-white font-semibold text-sm flex items-center gap-2">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
              Adicionar Tarefa
            </button>
          </div>
        </form>
      </section>

      <!-- Tasks Section -->
      <section>
        <div class="flex items-center justify-between mb-5">
          <h2 class="text-lg font-semibold text-white flex items-center gap-2">
            <svg class="w-5 h-5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
            Minhas Tarefas
          </h2>
          <div id="tasks-summary" class="text-xs text-slate-400 glass rounded-full px-3 py-1 hidden"></div>
        </div>
        <div id="tasks-list" class="space-y-3"></div>
      </section>

    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
